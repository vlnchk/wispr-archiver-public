[project]
name = "wispr-archiver"
version = "0.1.0"
description = "Append-only archive of Wispr Flow Notetaker meetings via the official Remote MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Wispr Archiver contributors" }
]
requires-python = ">=3.12"
dependencies = [
    # Official MCP SDK: streamable HTTP client + OAuthClientProvider.
    "mcp>=2.3.0,<3",
    # Strict validation of Wispr payloads; already a transitive dependency of mcp,
    # declared explicitly because we import it directly.
    "pydantic>=2.14.3,<3",
    # CLI.
    "typer>=0.29.2",
]

[project.scripts]
wispr-archiver = "wispr_archiver.cli:main"
wispr-mac = "wispr_archiver.mac:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "RET", "PTH", "N"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # localized upstream headings and legacy archive labels
    "N818",  # exception names like ReauthRequired / LockBusy read better without "Error"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: talks to the real Wispr MCP; run only by the owner with WISPR_LIVE=1",
]
